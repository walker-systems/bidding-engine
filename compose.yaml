services:
  redis:
    image: redis/redis-stack:latest
    container_name: bidding-redis
    ports:
      - "6379:6379"   # Database Port
      - "8001:8001"   # UI Port (RedisInsight)
    environment:
      - REDIS_ARGS="--save 60 1" # Snapshot save every 60s if 1 key changes
    volumes:
      - ./data:/data
