<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reactive Bidding Engine</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .price { font-size: 2.5rem; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        .bidder { color: #7f8c8d; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        #status { font-size: 0.8rem; margin-top: 10px; color: #e74c3c; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="item-name">Loading Auction...</h2>
    <div class="price">$<span id="current-price">0.00</span></div>
    <div class="bidder">Highest Bidder: <span id="high-bidder">None</span></div>

    <input type="text" id="user-name" placeholder="Your Name">
    <input type="number" id="bid-amount" placeholder="Bid Amount">
    <button onclick="placeBid()">Place Bid</button>
    <p id="status"></p>
</div>

<script>
    const auctionId = 'auction-1'; // Matches your database seed ID
    const statusEl = document.getElementById('status');

    // 1. Setup SSE Listener
    const eventSource = new EventSource(`/api/auctions/${auctionId}/stream`);

    eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.getElementById('item-name').innerText = data.itemId;
        document.getElementById('current-price').innerText = data.currentPrice.toFixed(2);
        document.getElementById('high-bidder').innerText = data.highBidder || 'None';
        statusEl.innerText = ""; // Clear errors on success
    };

    eventSource.onerror = () => {
        statusEl.innerText = "Connection lost. Reconnecting...";
    };

    // 2. Place Bid Function
    async function placeBid() {
        const bidder = document.getElementById('user-name').value;
        const amount = document.getElementById('bid-amount').value;

        if (!bidder || !amount) {
            statusEl.innerText = "Enter name and amount!";
            return;
        }

        try {
            const response = await fetch(`/api/auctions/${auctionId}/bids`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bidder, amount: parseFloat(amount) })
            });

            if (response.status === 409) {
                statusEl.innerText = "Conflict! Someone beat you to it. Try again.";
            } else if (!response.ok) {
                statusEl.innerText = "Error placing bid.";
            }
        } catch (err) {
            statusEl.innerText = "Server unreachable.";
        }
    }
</script>
</body>
</html>
