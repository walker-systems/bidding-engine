<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Bidding Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

<div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-extrabold text-gray-800 mb-2">Live Storefront</h1>
    <p class="text-gray-600 mb-8">Powered by Spring WebFlux & Redis</p>

    <div id="auction-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
</div>

<script>
    const activeAuctions = {};

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/auctions')
            .then(response => response.json())
            .then(auctions => {
                const grid = document.getElementById('auction-grid');
                grid.innerHTML = '';

                auctions.forEach(auction => {
                    createAuctionCard(auction, grid);

                    activeAuctions[auction.id] = {
                        endsAt: new Date(auction.endsAt).getTime(),
                        currentPrice: auction.currentPrice,
                        timerEl: document.getElementById(`timer-${auction.id}`),
                        btnEl: document.getElementById(`btn-${auction.id}`),
                        usernameEl: document.getElementById(`username-${auction.id}`),
                        amountEl: document.getElementById(`bid-amount-${auction.id}`)
                    };

                    connectToLiveStream(auction.id);
                });

                requestAnimationFrame(updateClocks);
            })
            .catch(err => console.error("Error fetching storefront:", err));
    });

    function createAuctionCard(auction, container) {
        const card = document.createElement('div');
        // Added smooth transition for the yellow halo
        card.className = "bg-white p-6 rounded-xl shadow-md border border-gray-200 transition-all duration-500 transform hover:-translate-y-1 flex flex-col";
        card.id = `card-${auction.id}`;

        card.innerHTML = `
                <div class="flex-grow">
                    <h2 class="text-xl font-bold text-gray-800 mb-2">${auction.itemId}</h2>

                    <div class="text-3xl font-black text-green-500 transition-all duration-500 opacity-100 mb-2" id="price-${auction.id}">
                        $${auction.currentPrice.toFixed(2)}
                    </div>

                    <div id="timer-${auction.id}" class="text-sm font-bold text-gray-600 mb-4 transition-colors duration-500">
                        Time Left: Loading...
                    </div>

                    <p class="text-sm text-gray-500 mb-4">
                        Highest Bidder: <span id="bidder-${auction.id}" class="font-semibold text-gray-700 transition-all duration-500 opacity-100">${auction.highBidder}</span>
                    </p>
                </div>

                <div class="flex space-x-2 mt-auto">
                    <input type="text" id="username-${auction.id}" placeholder="Username" class="w-1/2 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="demo_user">
                    <input type="number" id="bid-amount-${auction.id}" placeholder="$$$" class="w-1/4 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="${auction.currentPrice + 10}">
                    <button id="btn-${auction.id}" onclick="placeBid('${auction.id}')" class="w-1/4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        Bid
                    </button>
                </div>
                <p id="error-${auction.id}" class="text-red-500 text-xs mt-2 hidden"></p>
            `;
        container.appendChild(card);
    }

    function connectToLiveStream(auctionId) {
        const eventSource = new EventSource(`/api/auctions/${auctionId}/stream`);

        eventSource.onmessage = function(event) {
            const updatedAuction = JSON.parse(event.data);
            const auctionState = activeAuctions[updatedAuction.id];

            const cardElement = document.getElementById(`card-${auctionId}`);
            const priceElement = document.getElementById(`price-${auctionId}`);
            const bidderElement = document.getElementById(`bidder-${auctionId}`);
            const currentUser = document.getElementById(`username-${auctionId}`).value.trim();

            if (!auctionState || !priceElement || !bidderElement) return;

            // 1. YELLOW HALO LOGIC
            if (cardElement) {
                if (updatedAuction.highBidder === currentUser && currentUser !== "") {
                    cardElement.classList.add('ring-4', 'ring-yellow-400', 'border-transparent');
                } else {
                    // This automatically removes the halo when Sentinel reverts to "System"
                    cardElement.classList.remove('ring-4', 'ring-yellow-400', 'border-transparent');
                }
            }

            auctionState.endsAt = new Date(updatedAuction.endsAt).getTime();

            // 2. DETECT ROLLBACK (Green -> Fade -> Red -> Fade -> Green)
            if (updatedAuction.currentPrice < auctionState.currentPrice) {
                showFraudToast(`Fraudulent activity detected. Price reverted!`);

                const bidInput = document.getElementById(`bid-amount-${auctionId}`);
                if (bidInput) bidInput.value = updatedAuction.currentPrice + 10;

                // Step A: Fade Out Completely
                priceElement.classList.add('opacity-0');
                bidderElement.classList.add('opacity-0');

                // Step B: Wait 400ms for fade out, then swap to RED and fade in
                setTimeout(() => {
                    priceElement.innerText = `$${updatedAuction.currentPrice.toFixed(2)}`;
                    priceElement.classList.remove('text-green-500');
                    priceElement.classList.add('text-red-600');
                    priceElement.classList.remove('opacity-0');

                    bidderElement.innerText = updatedAuction.highBidder;
                    bidderElement.classList.remove('text-gray-700');
                    bidderElement.classList.add('text-red-600');
                    bidderElement.classList.remove('opacity-0');

                    // Step C: Wait 2 seconds so user reads the Red text, then fade out again
                    setTimeout(() => {
                        priceElement.classList.add('opacity-0');
                        bidderElement.classList.add('opacity-0');

                        // Step D: Wait 400ms, swap back to Green/Gray, fade in
                        setTimeout(() => {
                            priceElement.classList.remove('text-red-600');
                            priceElement.classList.add('text-green-500');
                            priceElement.classList.remove('opacity-0');

                            bidderElement.classList.remove('text-red-600');
                            bidderElement.classList.add('text-gray-700');
                            bidderElement.classList.remove('opacity-0');
                        }, 400);

                    }, 2000);

                }, 400);

            }
            // 3. NORMAL BID UPDATE (Green -> Fade -> Green)
            else if (updatedAuction.currentPrice > auctionState.currentPrice) {

                if (updatedAuction.highBidder !== "System") {
                    const bidInput = document.getElementById(`bid-amount-${auctionId}`);
                    if(bidInput) bidInput.value = updatedAuction.currentPrice + 10;
                }

                // Step A: Fade out current text
                priceElement.classList.add('opacity-0');
                bidderElement.classList.add('opacity-0');

                // Step B: Wait 400ms, update text, fade back in
                setTimeout(() => {
                    priceElement.innerText = `$${updatedAuction.currentPrice.toFixed(2)}`;
                    bidderElement.innerText = updatedAuction.highBidder;

                    priceElement.classList.remove('opacity-0');
                    bidderElement.classList.remove('opacity-0');
                }, 400);
            }

            // Update memory state
            auctionState.currentPrice = updatedAuction.currentPrice;

            const errorText = document.getElementById(`error-${auctionId}`);
            if(errorText) errorText.classList.add('hidden');
        };
    }

    function placeBid(auctionId) {
        const username = document.getElementById(`username-${auctionId}`).value;
        const amount = document.getElementById(`bid-amount-${auctionId}`).value;
        const errorText = document.getElementById(`error-${auctionId}`);

        fetch(`/api/auctions/${auctionId}/bids`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bidder: username, amount: amount })
        })
            .then(async response => {
                if (!response.ok) {
                    const error = await response.json();
                    errorText.innerText = error.detail || "Error placing bid";
                    errorText.classList.remove('hidden');
                } else {
                    showSuccessToast(`Bid of $${amount} placed successfully!`);
                }
            })
            .catch(err => {
                errorText.innerText = "Network error";
                errorText.classList.remove('hidden');
            });
    }

    let lastTick = 0;

    function updateClocks(timestamp) {
        if (timestamp - lastTick >= 1000) {
            const now = Date.now();

            for (const [id, data] of Object.entries(activeAuctions)) {
                const { endsAt, timerEl, btnEl, usernameEl, amountEl } = data;

                if (!timerEl) continue;

                const diff = endsAt - now;

                if (diff <= 0) {
                    timerEl.innerText = "SOLD!";
                    timerEl.className = "text-xl font-black text-red-600 mb-4 tracking-widest transition-all duration-500";

                    if (btnEl && !btnEl.disabled) {
                        btnEl.disabled = true;
                        btnEl.innerText = "Closed";
                        btnEl.className = "w-1/4 bg-gray-400 text-white font-bold py-2 px-4 rounded-lg cursor-not-allowed transition-all duration-500";

                        usernameEl.disabled = true;
                        usernameEl.className = "w-1/2 px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed";

                        amountEl.disabled = true;
                        amountEl.className = "w-1/4 px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed";

                        // Remove halo if time runs out
                        const cardElement = document.getElementById(`card-${id}`);
                        if(cardElement) cardElement.classList.remove('ring-4', 'ring-yellow-400', 'border-transparent');
                    }

                    delete activeAuctions[id];
                } else {
                    const seconds = Math.floor((diff / 1000) % 60);
                    const minutes = Math.floor((diff / 1000 / 60) % 60);

                    if (diff < 15000) {
                        timerEl.innerText = `⏳ Deal closing soon: 0${minutes}:${seconds.toString().padStart(2, '0')}`;
                        timerEl.classList.add("text-red-500");
                    } else {
                        timerEl.innerText = `Time Left: 0${minutes}:${seconds.toString().padStart(2, '0')}`;
                        timerEl.classList.remove("text-red-500");
                    }
                }
            }
            lastTick = timestamp;
        }

        requestAnimationFrame(updateClocks);
    }

    function showFraudToast(message) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = 'bg-red-600 text-white px-6 py-3 rounded shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-3 pointer-events-none';
        toast.innerHTML = `
        <span class="text-xl">🚨</span>
        <div class="flex flex-col">
            <span class="font-bold">Bid Rejected</span>
            <span class="text-sm">${message}</span>
        </div>
    `;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    function showSuccessToast(message) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = 'bg-green-600 text-white px-6 py-3 rounded shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-3 pointer-events-none';
        toast.innerHTML = `
        <span class="text-xl">✅</span>
        <div class="flex flex-col">
            <span class="font-bold">Success</span>
            <span class="text-sm">${message}</span>
        </div>
    `;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>

<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
</body>
</html>
